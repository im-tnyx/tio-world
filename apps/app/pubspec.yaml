name: tio_app
description: Tio Flutter phone app shell.
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.2
  device_info_plus: ^11.4.0
  image_picker: ^1.1.2
  tio_core:
    path: ../core
  tio_shared:
    path: ../shared
  tio_feature_auth:
    path: ../features/auth
  tio_feature_home:
    path: ../features/home
  tio_feature_splash:
    path: ../features/splash
  tio_feature_welcome:
    path: ../features/welcome
  tio_feature_onboarding:
    path: ../features/onboarding
  tio_feature_workout:
    path: ../features/workout
  tio_feature_nutrition:
    path: ../features/nutrition
  tio_feature_coaching:
    path: ../features/coaching
  tio_feature_progress:
    path: ../features/progress
  tio_feature_profile:
    path: ../features/profile
  tio_feature_settings:
    path: ../features/settings
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  shared_preferences_platform_interface: ^2.4.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "../core/assets/brand/dark_logo.jpg"

flutter:
  uses-material-design: true
