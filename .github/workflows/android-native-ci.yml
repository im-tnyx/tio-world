name: Android Native CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/app/android/**'
      - 'apps/app/lib/**'
      - 'apps/app/pubspec.yaml'
      - 'apps/app/pubspec.lock'
      - 'apps/wear/android/**'
      - 'apps/wear/lib/**'
      - 'apps/wear/pubspec.yaml'
      - 'apps/wear/pubspec.lock'
      - 'apps/shared/**'
      - 'apps/core/**'
      - 'apps/features/**'
      - 'pubspec.yaml'
      - 'melos.yaml'
      - '.github/workflows/android-native-ci.yml'
      - '.github/scripts/android_native_change_scope.py'
      - '.github/scripts/test_android_native_change_scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Select Android build targets
    runs-on: ubuntu-latest
    outputs:
      phone: ${{ steps.targets.outputs.phone }}
      wear: ${{ steps.targets.outputs.wear }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build selection rules
        run: python3 -m unittest discover -s .github/scripts -p test_android_native_change_scope.py

      - name: Select targets from exact PR diff
        id: targets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/android_native_change_scope.py

  phone:
    name: Build phone Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.phone == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter and restore SDK/Pub cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Restore Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to the PR ref; allow later runs of that PR to reuse them.
          cache-read-only: false

      - name: Enable Gradle build cache for CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.caching=true' >> "$HOME/.gradle/gradle.properties"

      - name: Toolchain info
        run: flutter --version

      - name: Resolve phone app dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Build phone Android debug APK
        working-directory: apps/app
        run: flutter build apk --debug --no-pub

  wear:
    name: Build Wear Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.wear == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter and restore SDK/Pub cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Restore Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to the PR ref; allow later runs of that PR to reuse them.
          cache-read-only: false

      - name: Enable Gradle build cache for CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.caching=true' >> "$HOME/.gradle/gradle.properties"

      - name: Toolchain info
        run: flutter --version

      - name: Resolve Wear app dependencies
        working-directory: apps/wear
        run: flutter pub get

      - name: Build Wear Android debug APK
        working-directory: apps/wear
        run: flutter build apk --debug --no-pub

  build_gate:
    name: Build Android debug APKs
    runs-on: ubuntu-latest
    needs: [detect, phone, wear]
    if: always()
    steps:
      - name: Require every selected Android build
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          PHONE_SELECTED: ${{ needs.detect.outputs.phone }}
          WEAR_SELECTED: ${{ needs.detect.outputs.wear }}
          PHONE_RESULT: ${{ needs.phone.result }}
          WEAR_RESULT: ${{ needs.wear.result }}
        run: |
          test "$DETECT_RESULT" = success
          if test "$PHONE_SELECTED" = true; then
            test "$PHONE_RESULT" = success
          else
            test "$PHONE_SELECTED" = false
            test "$PHONE_RESULT" = skipped
          fi
          if test "$WEAR_SELECTED" = true; then
            test "$WEAR_RESULT" = success
          else
            test "$WEAR_SELECTED" = false
            test "$WEAR_RESULT" = skipped
          fi
