name: Android Native CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/app/android/**'
      - 'apps/app/lib/app/health_connect/**'
      - 'apps/app/pubspec.yaml'
      - 'apps/app/pubspec.lock'
      - 'apps/wear/android/**'
      - 'apps/wear/lib/**'
      - 'apps/wear/pubspec.yaml'
      - 'apps/wear/pubspec.lock'
      - 'pubspec.yaml'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: phone
            directory: apps/app
          - target: Wear
            directory: apps/wear

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Toolchain info
        run: flutter --version

      - name: Resolve ${{ matrix.target }} app dependencies
        working-directory: ${{ matrix.directory }}
        run: flutter pub get

      - name: Build ${{ matrix.target }} Android debug APK
        working-directory: ${{ matrix.directory }}
        run: flutter build apk --debug --no-pub

  build_gate:
    name: Build Android debug APKs
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Require phone and Wear builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
