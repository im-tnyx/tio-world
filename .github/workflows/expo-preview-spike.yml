name: Issue 759 Expo preview feasibility (TEST ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/expo-go-preview/**'
      - '.ai/tasks/issue-759-expo-go-preview-spike.md'
      - '.github/workflows/expo-preview-spike.yml'
  workflow_dispatch:
    inputs:
      qa_web_compile:
        description: "Manually test QA Web compilation using existing client-safe QA secrets (no artifacts)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: expo-759-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-wrapper:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tnyx/issue-759-expo-go-preview-spike') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'tnyx/issue-759-expo-go-preview-spike')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate safe private-LAN URL contract
        run: node --test tools/expo-go-preview/*.test.js
      - name: Install Expo dev-only dependencies (no credentials)
        working-directory: tools/expo-go-preview
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: tools/expo-go-preview
        run: npx expo install --check
      - name: Verify Metro can bundle the Expo SDK 58 wrapper
        working-directory: tools/expo-go-preview
        env:
          EXPO_PUBLIC_FLUTTER_WEB_URL: http://192.168.1.25:7357
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/tio-expo-759-android-bundle"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/tio-expo-759-ios-bundle"

  flutter-web-compat:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tnyx/issue-759-expo-go-preview-spike') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'tnyx/issue-759-expo-go-preview-spike')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install exact existing Flutter CI SDK (3.47.9)
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.47.9 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Record Flutter version
        run: flutter --version
      - name: Compile Flutter Web from a disposable checkout only
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp/worktree" HEAD
          cd "$tmp/worktree/apps/app"
          flutter create --platforms=web --project-name=tio_app .
          node "$GITHUB_WORKSPACE/tools/expo-go-preview/prepare-web-snapshot.js" "$tmp/worktree"
          flutter pub get
          flutter build web --debug --no-pub
          echo "Browser-only disposable Web snapshot compiled. Testing synthetic client-safe QA configuration (not real secrets)."
          export TIO_QA_SUPABASE_URL="https://tio-synthetic-qa.supabase.co"
          export TIO_QA_SUPABASE_PUBLISHABLE_KEY="sb_publishable_syntheticCI1234"
          umask 077
          qa_file="$RUNNER_TEMP/tio-expo-qa-synthetic.json"
          trap 'rm -f "$qa_file"' EXIT
          python3 "$GITHUB_WORKSPACE/.github/scripts/mobile_qa_runtime_config.py" --output "$qa_file"
          node "$GITHUB_WORKSPACE/tools/expo-go-preview/qa-config-check.js" "$qa_file"
          flutter build web --debug --no-pub --dart-define-from-file="$qa_file"
          echo "Synthetic QA Web compile passed; credentials and user login were NOT tested."


  flutter-qa-web-manual-secrets:
    # Never read credentials on pull_request, and never upload a QA-built Web artifact.
    # This workflow must be registered on the default branch for GitHub Actions
    # to offer workflow_dispatch. Until owner-approved merge, this job remains unrun.
    if: github.event_name == 'workflow_dispatch' && inputs.qa_web_compile == true && github.ref_name == 'tnyx/issue-759-expo-go-preview-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned existing Flutter CI SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.47.9 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Create validated runner-local QA config from EXISTING manual mobile QA secrets
        shell: bash
        env:
          TIO_QA_SUPABASE_URL: ${{ secrets.TIO_IOS_QA_SUPABASE_URL }}
          TIO_QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TIO_IOS_QA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 .github/scripts/mobile_qa_runtime_config.py --output "$RUNNER_TEMP/tio-expo-qa-runtime.json"
          node tools/expo-go-preview/qa-config-check.js "$RUNNER_TEMP/tio-expo-qa-runtime.json"
      - name: Compile isolated QA Web snapshot without uploading or logging config
        shell: bash
        run: |
          set -euo pipefail
          set +x
          trap 'rm -f "$RUNNER_TEMP/tio-expo-qa-runtime.json"' EXIT
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp/worktree" HEAD
          cd "$tmp/worktree/apps/app"
          flutter create --platforms=web --project-name=tio_app .
          node "$GITHUB_WORKSPACE/tools/expo-go-preview/prepare-web-snapshot.js" "$tmp/worktree"
          flutter pub get
          flutter build web --debug --no-pub --dart-define-from-file="$RUNNER_TEMP/tio-expo-qa-runtime.json"
          echo "Manual CI QA Web compile complete; physical iPhone login still not verified."
      - name: Remove temporary QA runtime config
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tio-expo-qa-runtime.json"
