name: Supabase Database CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-db-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Replay and test database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DO_NOT_TRACK: '1'
      PGPASSWORD: postgres
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Toolchain info
        shell: bash
        run: |
          supabase --version
          docker version
          psql --version

      - name: Start disposable local Postgres without repository migrations
        shell: bash
        run: |
          mv supabase/migrations "$RUNNER_TEMP/repository-migrations"
          mkdir supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/repository-migrations" supabase/migrations

      - name: Replay baseline migrations and capture lint baseline
        shell: bash
        run: |
          versions=()
          for migration in supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            if [[ "$version" > "20260903091350" ]]; then
              continue
            fi
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --single-transaction \
              --file="$migration"
            versions+=("$version")
          done
          supabase migration repair --local --status applied --yes "${versions[@]}"
          supabase db lint --local --schema public,private --level error --fail-on none \
            2>&1 | tee "$RUNNER_TEMP/supabase-db-lint-baseline-raw.txt"
          sed -E \
            '/^(Connecting to local database\.\.\.|Linting schema: .*|No schema errors found|A new version of Supabase CLI is available:.*|We recommend updating regularly.*|)$/d' \
            "$RUNNER_TEMP/supabase-db-lint-baseline-raw.txt" \
            > "$RUNNER_TEMP/supabase-db-lint-baseline.txt"

      - name: Reinitialize the disposable database
        shell: bash
        run: |
          mv supabase/migrations "$RUNNER_TEMP/repository-migrations"
          mkdir supabase/migrations
          supabase db reset --local --no-seed
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/repository-migrations" supabase/migrations

      - name: Replay all migrations from scratch
        shell: bash
        run: |
          versions=()
          for migration in supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --single-transaction \
              --file="$migration"
            versions+=("$version")
          done
          supabase migration repair --local --status applied --yes "${versions[@]}"

      - name: Verify the complete migration ledger
        shell: bash
        run: |
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/_.*$//' \
            | sort > "$RUNNER_TEMP/expected-migrations.txt"
          psql "$DATABASE_URL" --tuples-only --no-align --set=ON_ERROR_STOP=1 \
            --command='select version from supabase_migrations.schema_migrations order by version' \
            > "$RUNNER_TEMP/applied-migrations.txt"
          diff --unified \
            "$RUNNER_TEMP/expected-migrations.txt" \
            "$RUNNER_TEMP/applied-migrations.txt"

      - name: Verify private helpers are outside the Data API
        shell: bash
        run: |
          api_config="$(sed -n '/^\[api\]/,/^\[/p' supabase/config.toml)"
          if grep -Eq '^schemas[[:space:]]*=.*"private"' <<<"$api_config"; then
            echo 'private must not be included in the configured Data API schemas.'
            exit 1
          fi

      - name: Run Slice B1 SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_67_meal_categories_b1.test.sql

      - name: Run TNYX-186 display-name SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_186_meal_category_display_name.test.sql

      - name: Run TNYX-194 manual MealLog SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_194_manual_meal_log_entries.test.sql

      - name: Run TNYX-203 MealLog revision SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_203_meal_log_revision.test.sql

      - name: Run TNYX-217 detailed MealLog SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_217_detailed_meal_log_persistence.test.sql

      - name: Run TNYX-218 detailed MealLog repository SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_218_detailed_meal_log_repository.test.sql

      - name: Run TNYX-233 user-profile country SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_233_user_profile_country_code.test.sql

      - name: Run TNYX-78 user Routine persistence SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_78_user_workout_routines.test.sql

      - name: Run TNYX-78 Program privilege hardening SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_78_user_workout_program_privileges.test.sql

      - name: Run TNYX-78 user Exercise persistence SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_78_user_workout_exercises.test.sql

      - name: Run TNYX-264 Custom Exercise definition SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_264_user_exercise_definition.test.sql

      - name: Run TNYX-509 Routine composition SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_509_routine_composition.test.sql

      - name: Run TNYX-509 Routine composition two-session race
        shell: bash
        run: bash supabase/tests/database/tnyx_509_routine_composition_concurrency.sh

      - name: Run TNYX-535 atomic Routine Create SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_535_atomic_routine_create.test.sql

      - name: Run TNYX-538/539 Routine Set metadata SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_538_539_routine_set_metadata.test.sql

      - name: Run W4 combined atomic Create and nullable Set SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_535_540_combined_routine_create.test.sql

      - name: Run TNYX-535 atomic Routine Create two-session races
        shell: bash
        run: bash supabase/tests/database/tnyx_535_atomic_routine_create_concurrency.sh

      - name: Run #534 archived Custom Routine Save SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_534_archived_custom_routine_save.test.sql

      - name: Run #534 archived Custom vs Routine Save two-session race
        shell: bash
        run: bash supabase/tests/database/tnyx_534_archived_custom_routine_save_concurrency.sh

      - name: Test #555 atomic Custom type expectations and Set shapes
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_555_atomic_custom_type_save.test.sql

      - name: Run #555 real two-session Custom type / Save race
        shell: bash
        run: bash supabase/tests/database/tnyx_555_atomic_custom_type_concurrency.sh

      - name: Run TNYX-81 atomic Routine Update SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_81_atomic_routine_update.test.sql

      - name: Run TNYX-81 protected Rename/stale Update two-session race
        shell: bash
        run: bash supabase/tests/database/tnyx_81_atomic_routine_update_concurrency.sh

      - name: Run #526 owner-scoped Routine Delete SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_526_owner_routine_delete.test.sql

      - name: Reject #526 retired Routine UUID replay across Create paths
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_526_routine_delete_anti_resurrection.test.sql

      - name: Enforce #526 cumulative Routine identity storage budget
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_526_routine_identity_budget.test.sql

      - name: Run #526 Create/Delete retirement order two-session races
        shell: bash
        run: bash supabase/tests/database/tnyx_526_routine_delete_anti_resurrection_concurrency.sh

      - name: Reject unsafe #526 Routine Delete fixture connection overrides
        shell: bash
        run: bash supabase/tests/database/tnyx_526_owner_routine_delete_guard.test.sh

      - name: Run #526 protected Rename/stale Delete two-session race
        shell: bash
        run: bash supabase/tests/database/tnyx_526_owner_routine_delete_concurrency.sh

      - name: Run #569 M2C permanent legacy Rename cutoff security matrix
        shell: bash
        run: |
          # The migration already revoked direct Name UPDATE in disposable CI.
          # The fixture rolls back only data and temporary Move EXECUTE.
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_569_m2c_legacy_rename_retirement_preflight.test.sql

      - name: Run #569 owner-scoped existing-Program Routine Move SQL matrix
        shell: bash
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_569_existing_program_routine_move.test.sql

      - name: Run #569 atomic new Program Create & Move SQL matrix
        shell: bash
        run: |
          # Fixture grants are transaction-local and rolled back.
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/database/tnyx_569_atomic_create_program_move.test.sql

      - name: Run #569 two-session races with CI-only temporary Move EXECUTE
        shell: bash
        run: |
          set -euo pipefail
          expected_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${DATABASE_URL:-}" != "$expected_url" ]]; then
            echo 'Move test grant must not be issued outside disposable CI database.' >&2
            exit 1
          fi
          sql_grant='grant execute on function public.move_user_workout_routine(uuid,uuid,uuid,bigint,uuid) to authenticated'
          sql_revoke='revoke all on function public.move_user_workout_routine(uuid,uuid,uuid,bigint,uuid) from public,anon,authenticated,service_role'
          cleanup_move_grant() {
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="$sql_revoke"
          }
          trap cleanup_move_grant EXIT
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="$sql_grant"
          bash supabase/tests/database/tnyx_569_existing_program_routine_move_concurrency.sh
          bash supabase/tests/database/tnyx_569_routine_move_cross_races.sh
          cleanup_move_grant
          trap - EXIT
          grant_visible="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 -At --command="
            select has_function_privilege('authenticated',
              'public.move_user_workout_routine(uuid,uuid,uuid,bigint,uuid)','EXECUTE')
              or has_function_privilege('anon',
              'public.move_user_workout_routine(uuid,uuid,uuid,bigint,uuid)','EXECUTE')
              or has_function_privilege('service_role',
              'public.move_user_workout_routine(uuid,uuid,uuid,bigint,uuid)','EXECUTE')" |
            tr -d '[:space:]')"
          if [[ "$grant_visible" != f ]]; then
            echo 'M1 Move RPC must remain dormant after disposable race tests' >&2
            exit 1
          fi

      - name: Run #569 atomic new-Program Move two-session no-orphan race
        shell: bash
        run: |
          set -euo pipefail
          expected_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${DATABASE_URL:-}" != "$expected_url" ]]; then
            echo 'Atomic Move grant must not run outside disposable CI database.' >&2
            exit 1
          fi
          sql_signature='public.create_user_workout_program_and_move_routine(uuid,uuid,uuid,text,bigint,uuid)'
          cleanup_atomic_move_grant() {
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="revoke all on function $sql_signature from public,anon,authenticated,service_role"
          }
          trap cleanup_atomic_move_grant EXIT
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="grant execute on function $sql_signature to authenticated"
          bash supabase/tests/database/tnyx_569_atomic_create_program_move_concurrency.sh
          bash supabase/tests/database/tnyx_569_atomic_create_program_id_collision.sh
          bash supabase/tests/database/tnyx_569_atomic_create_move_vs_delete_concurrency.sh
          cleanup_atomic_move_grant
          trap - EXIT
          can_execute="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 -At --command="
            select has_function_privilege('authenticated','$sql_signature','EXECUTE')
              or has_function_privilege('anon','$sql_signature','EXECUTE')
              or has_function_privilege('service_role','$sql_signature','EXECUTE')
          " | tr -d '[:space:]')"
          if [[ "$can_execute" != f ]]; then
            echo 'Atomic Create+Move must remain dormant after race fixture.' >&2
            exit 1
          fi

      - name: Run real two-session concurrency test
        shell: bash
        run: bash supabase/tests/database/tnyx_67_meal_categories_b1_concurrency.sh

      - name: Reject B1-introduced database lint errors
        shell: bash
        run: |
          supabase db lint --local --schema public,private --level error --fail-on none \
            2>&1 | tee "$RUNNER_TEMP/supabase-db-lint-current-raw.txt"
          sed -E \
            '/^(Connecting to local database\.\.\.|Linting schema: .*|No schema errors found|A new version of Supabase CLI is available:.*|We recommend updating regularly.*|)$/d' \
            "$RUNNER_TEMP/supabase-db-lint-current-raw.txt" \
            > "$RUNNER_TEMP/supabase-db-lint-current.txt"
          diff --unified \
            "$RUNNER_TEMP/supabase-db-lint-baseline.txt" \
            "$RUNNER_TEMP/supabase-db-lint-current.txt"
