name: Flutter CI

on:
  push:
    branches:
      - main
      - codex/onboarding-mode-migration
    paths:
      - 'apps/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Toolchain info
        run: flutter --version

      - name: Install Melos
        shell: bash
        run: |
          dart pub global activate melos 2.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze Flutter packages
        run: melos exec -c 1 --flutter --fail-fast -- "flutter analyze --no-pub"

      - name: Analyze Dart packages
        run: melos exec -c 1 --no-flutter --fail-fast -- "dart analyze ."

      - name: Final enforcement audit
        id: final_audit
        continue-on-error: true
        shell: bash
        run: |
          cd apps/core
          flutter pub get
          flutter test --no-pub \
            test/theme/final_enforcement_visual_ownership_test.dart \
            test/theme/final_enforcement_architecture_test.dart

      - name: Upload final enforcement audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-enforcement-audit
          path: |
            apps/core/final-visual-violations.txt
            apps/core/final-architecture-violations.txt
          if-no-files-found: ignore

      - name: Fail final enforcement audit
        if: steps.final_audit.outcome == 'failure'
        run: exit 1

      - name: Test Flutter packages
        run: melos exec -c 1 --flutter --dir-exists=test --fail-fast -- "flutter pub get && flutter test --no-pub"

      - name: Test Dart packages
        run: melos exec -c 1 --no-flutter --dir-exists=test --fail-fast -- "dart test"
