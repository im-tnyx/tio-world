name: Docs Hygiene CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.ai/**'
      - 'docs/**'
      - '.github/workflows/docs-hygiene-ci.yml'

permissions:
  contents: read

concurrency:
  group: docs-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-diff-hygiene:
    name: Check documentation diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact trusted PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact PR refs and documentation diff
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid PR number or commit SHA format'
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo '::error::Checkout does not match exact PR base SHA'
            exit 1
          fi

          # Fetch the PR tip as data; never check it out or execute its code.
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/docs-hygiene-pr-head"
          actual_head="$(git rev-parse refs/remotes/origin/docs-hygiene-pr-head)"
          if [[ "$actual_head" != "$PR_HEAD_SHA" ]]; then
            echo '::error::PR head moved after this event; require a new exact-head run'
            exit 1
          fi

          git merge-base "$BASE_SHA" "$PR_HEAD_SHA" >/dev/null
          echo "Base: $BASE_SHA"
          echo "PR head: $PR_HEAD_SHA"
          echo 'Checking .ai/, docs/, and this workflow file (three-dot merge-base diff)'
          git diff --check "$BASE_SHA...$PR_HEAD_SHA" -- .ai/ docs/ .github/workflows/docs-hygiene-ci.yml
          echo 'PASS: documentation diff hygiene'
