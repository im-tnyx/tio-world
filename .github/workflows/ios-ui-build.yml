name: iOS UI Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build without backend config or with QA Supabase email/password login
        required: true
        type: choice
        default: ui_only
        options:
          - ui_only
          - qa_login

permissions:
  contents: read

jobs:
  build_unsigned_profile_ipa:
    name: Build unsigned iOS profile IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Record build toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Keep iOS dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve Flutter packages
        working-directory: apps/app
        run: flutter pub get

      - name: Validate and write QA Supabase runtime config
        if: inputs.build_mode == 'qa_login'
        shell: bash
        env:
          TIO_IOS_QA_SUPABASE_URL: ${{ secrets.TIO_IOS_QA_SUPABASE_URL }}
          TIO_IOS_QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TIO_IOS_QA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 .github/scripts/ios_qa_runtime_config.py \
            --mode qa_login \
            --output "$RUNNER_TEMP/tio-ios-runtime-config.json"

      - name: Build unsigned profile device app
        working-directory: apps/app
        env:
          IOS_BUILD_MODE: ${{ inputs.build_mode || 'ui_only' }}
        run: |
          set -euo pipefail
          set +x

          build_args=(
            flutter build ios --profile --no-codesign
            --build-name=0.0.0
            --build-number=${{ github.run_number }}
          )
          if [[ "$IOS_BUILD_MODE" == "qa_login" ]]; then
            build_args+=("--dart-define-from-file=$RUNNER_TEMP/tio-ios-runtime-config.json")
          fi

          "${build_args[@]}"

      - name: Remove temporary QA Supabase runtime config
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tio-ios-runtime-config.json"

      - name: Package and verify iPhone artifact
        shell: bash
        working-directory: apps/app
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'ui_only' }}
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/tio-ios-ui-artifact"
          app_path="build/ios/iphoneos/Runner.app"
          mkdir -p "$artifact_dir/Payload"

          test -d "$app_path"
          test ! -e "$app_path/embedded.mobileprovision"

          test -f ios/Podfile.lock
          lipo -archs "$app_path/Runner" | tr ' ' '\n' | grep -Fx arm64

          ditto "$app_path" "$artifact_dir/Payload/Runner.app"

          cp ios/Podfile.lock "$artifact_dir/Podfile.lock"
          (
            cd "$artifact_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload Tio-unsigned-profile.ipa
            shasum -a 256 Tio-unsigned-profile.ipa > Tio-unsigned-profile.ipa.sha256
            source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
            {
              echo "source_sha=${source_sha}"
              echo "build_sha=${GITHUB_SHA}"
              echo "event=${GITHUB_EVENT_NAME}"
              echo "repository=${GITHUB_REPOSITORY}"
              echo "flutter=$(flutter --version | head -n 1)"
              echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
              echo "build_mode=${BUILD_MODE}"
              echo "signing=none"
              echo "bundle_identifier=com.tnyx.tio"
            } > provenance.txt
          )

      - name: Upload unsigned iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: tio-ios-${{ inputs.build_mode || 'ui_only' }}-unsigned-profile-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/tio-ios-ui-artifact/Tio-unsigned-profile.ipa
            ${{ runner.temp }}/tio-ios-ui-artifact/Tio-unsigned-profile.ipa.sha256
            ${{ runner.temp }}/tio-ios-ui-artifact/Podfile.lock
            ${{ runner.temp }}/tio-ios-ui-artifact/provenance.txt
          if-no-files-found: error
          retention-days: 7
